services:
  cli:
    build: .
    container_name: cli
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/starcraft2?sslmode=disable
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PLAYERS: ${PLAYERS:-}
      REPLAYS: /replays
      WORKERS: ${WORKERS:-}
    profiles: ["cli"]
    volumes:
      - .:/sources
      - ${REPLAYS_HOST:-./replays}:/replays:ro

  postgres:
    container_name: postgres
    environment:
      POSTGRES_DB: starcraft2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: postgres
    healthcheck:
      interval: 5s
      retries: 10
      test: ["CMD-SHELL", "pg_isready -U postgres -d starcraft2"]
      timeout: 5s
    image: postgres:18.4
    volumes:
      - ./postgres:/var/lib/postgresql
      - ./sqlc/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  ui:
    build: .
    command: ["-action", "serve"]
    container_name: ui
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/starcraft2?sslmode=disable
      ENVIRONMENT: ${ENVIRONMENT:-production}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-chat}
      PLAYERS: ${PLAYERS:-}
      PORT: "8080"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - .:/sources
