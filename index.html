<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StarCraft II Replay Q&amp;A</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<aside id="sidebar">
<button id="new-chat">New chat</button>
<ul id="conversations"></ul>
</aside>
<main id="main">
<div id="messages"></div>
<form id="composer">
<textarea id="prompt" rows="2" placeholder="Ask about the replays, e.g. PlayerA's win rate on a given map" autocomplete="off"></textarea>
<button id="send" type="submit">Send</button>
</form>
</main>
<script src="index.js" defer></script>
</body>
</html>
